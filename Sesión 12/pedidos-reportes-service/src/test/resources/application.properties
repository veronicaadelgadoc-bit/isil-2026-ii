# ==================================================================
# PA4 - Configuración de PRUEBAS (sobrescribe src/main/resources).
# H2 en memoria con modo MySQL; no requiere MySQL para `mvn test`.
# ==================================================================
spring.application.name=pedidos-reportes-service-test

spring.datasource.url=jdbc:h2:mem:reportesdb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
spring.sql.init.data-locations=classpath:db/data-h2.sql

logging.level.org.springframework.jdbc.core=INFO
